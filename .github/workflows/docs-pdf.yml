name: Build docs PDF

on:
  push:
    branches: [docs/refresh-readme-pdf]
    paths:
      - README.md
      - doc/_build_pdf.py
      - .github/workflows/docs-pdf.yml

permissions:
  contents: write

jobs:
  build-pdf:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install ReportLab
        shell: pwsh
        run: python -m pip install --disable-pip-version-check reportlab
      - name: Build documentation PDF
        shell: pwsh
        run: python doc/_build_pdf.py
      - name: Commit generated PDF
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add doc/HH_Agent_System_Documentation.pdf
          if (git diff --cached --quiet) { exit 0 }
          git commit -m "Обновлён PDF документации"
          git push origin HEAD:docs/refresh-readme-pdf
