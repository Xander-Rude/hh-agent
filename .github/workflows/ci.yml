name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, feature/ai-relevant-cover-letter-project]

permissions:
  contents: read

jobs:
  windows-checks:
    name: Windows / Python 3.12
    runs-on: windows-latest
    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: "utf-8"
      HH_APPLY_DOM_TESTS: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test dependencies
        shell: pwsh
        run: python -m pip install --disable-pip-version-check sqlalchemy httpx python-dotenv ollama python-telegram-bot playwright pyyaml

      - name: Install Chromium for HH form regression tests
        shell: pwsh
        run: python -m playwright install chromium

      - name: Check whitespace errors
        shell: pwsh
        run: git diff --check ${{ github.event.pull_request.base.sha || github.event.before }} ${{ github.sha }}

      - name: Compile Python sources
        shell: pwsh
        run: python -m compileall -q .

      - name: Validate deployment PowerShell
        shell: pwsh
        run: |
          $path = "deploy/octopus_deploy.ps1"
          $null = [scriptblock]::Create((Get-Content -Raw -LiteralPath $path))

      - name: Run core unit tests
        shell: pwsh
        run: python -m unittest discover -s tests -p "test_*.py" -v
