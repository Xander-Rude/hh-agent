name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  windows-checks:
    name: Windows / Python 3.12
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check whitespace errors
        shell: pwsh
        run: git diff --check ${{ github.event.pull_request.base.sha || github.event.before }} ${{ github.sha }}

      - name: Compile Python sources
        shell: pwsh
        run: python -m compileall -q .

      - name: Run core unit tests
        shell: pwsh
        run: python -m unittest discover -s tests -p "test_*.py" -v
