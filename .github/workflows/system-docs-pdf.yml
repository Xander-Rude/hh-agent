name: Validate system documentation PDF

on:
  pull_request:
    paths:
      - doc/HH_Agent_System_Documentation.md
      - doc/HH_Agent_System_Documentation.pdf
      - doc/build_system_pdf.py
      - dashboard/static/fonts/manrope-*.woff2
      - .github/workflows/system-docs-pdf.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  render:
    name: Validate committed PDF and rebuild source
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install documentation renderer
        run: python -m pip install --disable-pip-version-check 'mistune>=3,<4' 'weasyprint>=68,<69'

      - name: Validate committed PDF signature
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('doc/HH_Agent_System_Documentation.pdf')
          data = path.read_bytes()
          if not data.startswith(b'%PDF-') or b'%%EOF' not in data[-2048:]:
              raise SystemExit('Committed file is not a valid PDF container')
          print(f'Validated committed {path}: {len(data)} bytes')
          PY

      - name: Rebuild PDF from Markdown
        run: python doc/build_system_pdf.py

      - name: Validate rebuilt PDF signature
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('doc/HH_Agent_System_Documentation.pdf')
          data = path.read_bytes()
          if not data.startswith(b'%PDF-') or b'%%EOF' not in data[-2048:]:
              raise SystemExit('Rebuilt file is not a valid PDF container')
          print(f'Validated rebuilt {path}: {len(data)} bytes')
          PY
