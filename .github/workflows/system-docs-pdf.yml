name: Validate system documentation PDF

on:
  pull_request:
    paths:
      - doc/HH_Agent_System_Documentation.md
      - doc/HH_Agent_System_Documentation.pdf
      - doc/build_system_pdf.py
      - dashboard/static/fonts/manrope-*.woff2
      - .github/workflows/system-docs-pdf.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  render:
    name: Rebuild and validate system documentation PDF
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install documentation renderer
        run: python -m pip install --disable-pip-version-check 'mistune>=3,<4' 'weasyprint>=68,<69'

      - name: Rebuild PDF from Markdown
        run: python doc/build_system_pdf.py

      - name: Validate PDF signature
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('doc/HH_Agent_System_Documentation.pdf')
          data = path.read_bytes()
          if not data.startswith(b'%PDF-') or b'%%EOF' not in data[-2048:]:
              raise SystemExit('Generated file is not a valid PDF container')
          print(f'Validated {path}: {len(data)} bytes')
          PY

      - name: Ensure committed PDF matches source
        shell: bash
        run: |
          if ! git diff --exit-code -- doc/HH_Agent_System_Documentation.pdf; then
            echo 'The committed PDF is out of sync with its Markdown source.'
            echo 'Run: python doc/build_system_pdf.py'
            exit 1
          fi
