name: CD

on:
  workflow_run:
    workflows: ["CI"]
    branches: [main]
    types: [completed]

permissions:
  contents: read

concurrency:
  group: octopus-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to Production
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest

    env:
      OCTOPUS_URL: https://hh-agent.octopus.app
      OCTOPUS_API_KEY: ${{ secrets.OCTOPUS_API_KEY }}
      OCTOPUS_SPACE: Default

    steps:
      - name: Create Octopus release
        id: create_release
        uses: OctopusDeploy/create-release-action@v4
        with:
          project: HH Agent
          release_notes: |
            GitHub CI run: ${{ github.event.workflow_run.html_url }}
            Commit: ${{ github.event.workflow_run.head_sha }}

      - name: Deploy release to Production
        id: deploy_release
        uses: OctopusDeploy/deploy-release-action@v4
        with:
          project: HH Agent
          release_number: ${{ steps.create_release.outputs.release_number }}
          environments: Production
          variables: |
            GitHub.CommitSha:${{ github.event.workflow_run.head_sha }}

      - name: Wait for Octopus Production deployment
        id: await_deployment
        uses: OctopusDeploy/await-task-action@v4
        with:
          server_task_id: ${{ fromJson(steps.deploy_release.outputs.server_tasks)[0].serverTaskId }}
          polling_interval: 10
          timeout_after: 9000
          cancel_on_timeout: false

      - name: Verify Octopus Production deployment
        shell: bash
        env:
          OCTOPUS_TASK_STATE: ${{ steps.await_deployment.outputs.task_state }}
        run: |
          echo "Octopus task state: ${OCTOPUS_TASK_STATE:-unknown}"
          if [ "$OCTOPUS_TASK_STATE" != "Success" ]; then
            echo "::error::Octopus Production deployment finished with state ${OCTOPUS_TASK_STATE:-unknown}"
            exit 1
          fi
